name: Build telegram-bot-api

on:
  push:
    branches: [master]
    paths: ['.github/workflows/build.yml']
  workflow_dispatch:

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    # Built on Debian 12 (glibc 2.36) so the binary runs on Debian/Armbian
    # bookworm and anything newer. A binary built directly on the Ubuntu 24.04
    # runner needs glibc 2.39 and does not start on bookworm.
    container: debian:bookworm
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git make cmake g++ gperf libssl-dev zlib1g-dev file

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # OpenSSL, zlib and the C++ runtime are linked statically, so the board
      # needs no extra packages: only glibc.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/build/install" \
            -DOPENSSL_USE_STATIC_LIBS=TRUE \
            -DZLIB_USE_STATIC_LIBS=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"

      - name: Build and install
        run: cmake --build build --target install -j"$(nproc)"

      - name: Smoke test
        run: |
          cd build/install/bin
          strip telegram-bot-api
          file telegram-bot-api
          ldd telegram-bot-api
          ./telegram-bot-api --version
          sha256sum telegram-bot-api | tee telegram-bot-api.sha256

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: telegram-bot-api-linux-${{ matrix.arch }}
          path: |
            build/install/bin/telegram-bot-api
            build/install/bin/telegram-bot-api.sha256
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # OpenSSL and zlib are linked statically (static-md triplet), so the
      # result is a single telegram-bot-api.exe. gperf is only a build tool.
      - name: Install dependencies
        shell: pwsh
        run: |
          # gperf comes from Chocolatey: vcpkg builds it from the GNU mirrors,
          # which time out on the runners.
          choco install gperf -y --no-progress
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install openssl:x64-windows-static-md zlib:x64-windows-static-md

      - name: Configure
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT.Replace([char]92, [char]47)
          cmake -S . -B build -A x64 `
            "-DCMAKE_INSTALL_PREFIX=$PWD/build/install" `
            "-DCMAKE_TOOLCHAIN_FILE=$vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Build and install
        run: cmake --build build --target install --config Release --parallel

      - name: Smoke test
        shell: pwsh
        run: |
          cd build/install/bin
          ./telegram-bot-api.exe --version
          (Get-FileHash telegram-bot-api.exe -Algorithm SHA256).Hash.ToLower() + "  telegram-bot-api.exe" | Tee-Object telegram-bot-api.exe.sha256

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: telegram-bot-api-windows-amd64
          path: |
            build/install/bin/telegram-bot-api.exe
            build/install/bin/telegram-bot-api.exe.sha256
          if-no-files-found: error
