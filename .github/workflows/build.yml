name: Build telegram-bot-api

on:
  push:
    branches: [master]
    paths: ['.github/workflows/build.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ gperf libssl-dev zlib1g-dev

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PWD/install ..

      - name: Build and install
        run: cmake --build build --target install -j$(nproc)

      - name: Smoke test
        run: ./build/install/bin/telegram-bot-api --help | head -8

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: telegram-bot-api-linux-amd64
          path: build/install/bin/telegram-bot-api
          if-no-files-found: error
